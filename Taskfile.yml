version: "3"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  dev:
    desc: Start development server
    cmds:
      - pnpm dev

  build:
    desc: Build for production
    cmds:
      - pnpm build

  preview:
    desc: Preview production build
    cmds:
      - pnpm preview

  test:
    desc: Run all tests
    cmds:
      - pnpm test:unit

  test:unit:
    desc: Run unit tests
    cmds:
      - pnpm test:unit

  test:e2e:
    desc: Run e2e tests
    cmds:
      - pnpm test:e2e

  lint:
    desc: Run linter
    cmds:
      - pnpm lint

  check:
    desc: Run typecheck + lint
    cmds:
      - pnpm check
      - pnpm lint

  fmt:
    desc: Format code
    cmds:
      - pnpm format

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf build/ .svelte-kit/ node_modules/
